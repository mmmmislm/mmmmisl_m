<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Все соцсети mmmmisl_m в одном месте — Telegram, Instagram, TikTok, Threads, WB Chat, Meera">
    <link rel="canonical" href="https://mmmmislm.github.io/mmmmisl_m/">
    
    <meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="mmmmisl_m">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="msapplication-TileColor" content="#1c1c1e">

    <link rel="icon" type="image/png" sizes="192x192" href="/mmmmisl_m/icon.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/mmmmisl_m/icon.png">
    <link rel="apple-touch-icon" href="/mmmmisl_m/icon_home.png">
    <link rel="manifest" href="/mmmmisl_m/manifest.json">

    <title>Соцсети mmmmisl_m</title>

    <script>
        (function() {
            try {
                var t = localStorage.getItem('theme') || 'auto';
                var eff = t;
                if (t === 'auto') {
                    eff = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
                }
                document.documentElement.setAttribute('data-theme', eff);
                var meta = document.querySelector('meta[name="theme-color"]:not([media])');
                if (meta) meta.setAttribute('content', eff === 'light' ? '#f2f2f7' : '#1c1c1e');
            } catch (e) {}
        })();
    </script>

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
            scroll-behavior: smooth;
        }
        body {
            min-height: 100vh;
            line-height: 1.4;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        img, picture, svg, video { display: block; max-width: 100%; }
        button, input, select, textarea {
            font: inherit;
            color: inherit;
            background: none;
            border: none;
            outline: none;
        }
        button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
        a { color: inherit; text-decoration: none; }
        h1, h2, h3, h4 { font-weight: inherit; line-height: 1.2; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }

        :root {
            --bg-app: linear-gradient(-45deg, #2c2c2c, #1a1a1a, #3a3a3a, #0d0d0d);
            --bg-app-size: 400% 400%;
            --surface: rgba(255, 255, 255, 0.06);
            --surface-hover: rgba(255, 255, 255, 0.08);
            --surface-active: rgba(255, 255, 255, 0.12);
            --surface-solid: rgba(28, 28, 30, 0.92);
            --border: rgba(255, 255, 255, 0.08);
            --border-strong: rgba(255, 255, 255, 0.15);
            --border-very-strong: rgba(255, 255, 255, 0.25);
            --text: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-tertiary: rgba(255, 255, 255, 0.5);
            --text-quaternary: rgba(255, 255, 255, 0.4);
            --shadow-sm: 0 4px 20px rgba(0, 0, 0, 0.08);
            --shadow-md: 0 8px 32px rgba(0, 0, 0, 0.12);
            --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.3);
            --shadow-xl: 0 30px 80px rgba(0, 0, 0, 0.5);
            --inset-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.08);
            --overlay: rgba(0, 0, 0, 0.5);
            --skeleton: rgba(255, 255, 255, 0.06);
            --blur: 20px;
            --blur-strong: 30px;
            --color-telegram: #0088cc;
            --color-telegram-rgb: 0, 136, 204;
            --color-instagram: #e4405f;
            --color-instagram-rgb: 228, 64, 95;
            --color-threads: #FF8C00;
            --color-threads-rgb: 255, 140, 0;
            --color-tiktok: #2ECC71;
            --color-tiktok-rgb: 46, 204, 113;
            --color-wb: #5a8de2;
            --color-wb-rgb: 90, 141, 226;
            --color-meera: #ff6b6b;
            --color-meera-rgb: 255, 107, 107;
            --color-success: #2ecc71;
            --emoji-opacity: 0.13;
            --radius-sm: 12px;
            --radius-md: 20px;
            --radius-lg: 28px;
            --radius-xl: 40px;
            --radius-full: 9999px;
            --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
            --ease-out: cubic-bezier(0.25, 0.1, 0.25, 1);
        }

        [data-theme="light"] {
            --bg-app: linear-gradient(-45deg, #e8e8ed, #f2f2f7, #ebebf0, #f7f7fa);
            --surface: rgba(255, 255, 255, 0.5);
            --surface-hover: rgba(255, 255, 255, 0.65);
            --surface-active: rgba(0, 0, 0, 0.06);
            --surface-solid: rgba(255, 255, 255, 0.94);
            --border: rgba(0, 0, 0, 0.06);
            --border-strong: rgba(0, 0, 0, 0.1);
            --border-very-strong: rgba(0, 0, 0, 0.18);
            --text: #1d1d1f;
            --text-secondary: rgba(0, 0, 0, 0.7);
            --text-tertiary: rgba(0, 0, 0, 0.5);
            --text-quaternary: rgba(0, 0, 0, 0.4);
            --shadow-sm: 0 4px 20px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 8px 32px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.1);
            --shadow-xl: 0 30px 80px rgba(0, 0, 0, 0.15);
            --inset-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.6);
            --overlay: rgba(0, 0, 0, 0.25);
            --skeleton: rgba(0, 0, 0, 0.04);
            --emoji-opacity: 0.08;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI",
                         Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            color: var(--text);
            background: var(--bg-app);
            background-size: var(--bg-app-size);
            transition: background 0.6s ease, color 0.6s ease;
            overflow-x: hidden;
            padding-bottom: calc(120px + env(safe-area-inset-bottom));
        }

        @media (prefers-reduced-motion: no-preference) {
            body { animation: gradientMove 25s ease infinite; }
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .app {
            position: relative;
            z-index: 1;
            min-height: 100vh;
        }

        .view {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            padding: 20px 16px 30px;
            animation: viewIn 0.4s var(--ease-out) both;
        }
        .view[hidden] { display: none; }

        @keyframes viewIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hero {
            text-align: center;
            padding: 20px 0 12px;
        }
        .hero__title {
            font-size: 1.8rem;
            font-weight: 650;
            letter-spacing: -0.035em;
            color: var(--text);
            margin-bottom: 6px;
        }
        .hero__subtitle {
            font-size: 1rem;
            color: var(--text-secondary);
        }

        .filters {
            display: flex;
            gap: 8px;
            padding: 16px 16px 20px;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            scroll-snap-type: x proximity;
            margin: 0 -16px;
        }
        .filters::-webkit-scrollbar { display: none; }

        .cards {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .footer {
            text-align: left;
            padding: 30px 0 10px;
            font-size: 0.9rem;
            color: var(--text-tertiary);
        }

        .view--search {
            padding-top: 32px;
            padding-bottom: 140px;
        }
        .search {
            display: flex;
            flex-direction: column;
            gap: 16px;
            min-height: calc(100vh - 200px);
        }
        .search__field {
            position: sticky;
            top: 20px;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 16px;
            height: 56px;
            background: var(--surface);
            backdrop-filter: blur(var(--blur-strong)) saturate(180%);
            -webkit-backdrop-filter: blur(var(--blur-strong)) saturate(180%);
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-full);
            box-shadow: var(--shadow-md), var(--inset-highlight);
            transition: border-color 0.2s ease, background 0.2s ease;
        }
        .search__field:focus-within {
            border-color: var(--border-very-strong);
            background: var(--surface-hover);
        }
        .search__icon {
            flex-shrink: 0;
            width: 20px;
            height: 20px;
            color: var(--text-tertiary);
        }
        .search__input {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            font-size: 1.05rem;
            color: var(--text);
            min-width: 0;
        }
        .search__input::placeholder { color: var(--text-quaternary); }
        .search__input::-webkit-search-cancel-button { display: none; }
        .search__clear {
            flex-shrink: 0;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-tertiary);
            border-radius: 50%;
            transition: color 0.2s ease;
        }
        .search__clear:hover { color: var(--text); }
        .search__clear svg { width: 20px; height: 20px; }
        .search__results {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .bg-emojis {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .bg-emojis__item {
            position: absolute;
            font-size: var(--size, 3rem);
            opacity: 0;
            user-select: none;
            transform: translateZ(0);
            transition: opacity 0.8s ease;
            will-change: transform;
        }
        .bg-emojis__item--visible { opacity: var(--emoji-opacity); }

        @media (prefers-reduced-motion: no-preference) {
            .bg-emojis__item--visible {
                animation: float var(--duration, 28s) ease-in-out infinite alternate;
                animation-delay: var(--delay, 0s);
            }
        }
        @keyframes float {
            0% { transform: translate(0, 0) rotate(var(--rot, 0deg)) scale(1); }
            100% { transform: translate(var(--dx, 40px), var(--dy, -40px)) rotate(calc(var(--rot, 0deg) + 15deg)) scale(1.12); }
        }

        .splash {
            position: fixed;
            inset: 0;
            background: var(--bg-app);
            background-size: var(--bg-app-size);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }
        .splash--hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .splash__inner {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .splash__emoji { font-size: 4rem; margin-bottom: 10px; }
        .splash__title {
            font-size: 2rem;
            font-weight: 650;
            letter-spacing: -0.035em;
            color: var(--text);
        }
        .splash__subtitle {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 20px;
        }
        .splash__loader {
            display: flex;
            gap: 7px;
            margin-top: 12px;
        }
        .splash__loader span {
            width: 10px;
            height: 10px;
            background: var(--text-secondary);
            border-radius: 50%;
            animation: dotWave 1.2s ease-in-out infinite both;
        }
        .splash__loader span:nth-child(1) { animation-delay: -0.32s; }
        .splash__loader span:nth-child(2) { animation-delay: -0.16s; }
        .splash__loader span:nth-child(3) { animation-delay: 0s; }
        .splash__loader span:nth-child(4) { animation-delay: 0.16s; }
        .splash__loader span:nth-child(5) { animation-delay: 0.32s; }
        @keyframes dotWave {
            0%, 80%, 100% { transform: scale(0.5); opacity: 0.2; }
            40% { transform: scale(1.2); opacity: 1; }
        }

        .chip {
            flex-shrink: 0;
            padding: 9px 18px;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-tertiary);
            background: var(--surface);
            backdrop-filter: blur(var(--blur)) saturate(180%);
            -webkit-backdrop-filter: blur(var(--blur)) saturate(180%);
            border: 1px solid var(--border);
            border-radius: var(--radius-full);
            scroll-snap-align: start;
            transition: all 0.25s var(--ease-out);
        }
        .chip:hover {
            color: var(--text-secondary);
            background: var(--surface-hover);
            transform: translateY(-1px);
        }
        .chip--active {
            color: var(--text);
            background: var(--surface-active);
            border-color: var(--border-strong);
            box-shadow: inset 0 0 15px rgba(255, 255, 255, 0.06);
        }
        [data-theme="light"] .chip--active {
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.06);
        }
        .chip:active { transform: scale(0.95); }

        .card {
            position: relative;
            display: block;
            width: 100%;
            padding: 28px 30px;
            text-align: left;
            background: var(--surface);
            backdrop-filter: blur(var(--blur)) saturate(180%);
            -webkit-backdrop-filter: blur(var(--blur)) saturate(180%);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-md), var(--inset-highlight);
            transition: all 0.4s var(--ease-out);
            overflow: hidden;
            opacity: 0;
            transform: translateY(20px) scale(0.96);
        }
        .card--visible {
            opacity: 1;
            transform: translateY(0) scale(1);
            transition: opacity 0.5s var(--ease-spring), transform 0.5s var(--ease-spring),
                        background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }
        .card::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: inherit;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), transparent 40%, transparent 60%, rgba(255, 255, 255, 0.1));
            opacity: 0.3;
            transition: opacity 0.4s ease;
            pointer-events: none;
            z-index: -1;
        }
        .card:hover::before { opacity: 0.6; }
        .card:hover {
            background: var(--surface-hover);
            border-color: var(--border-strong);
            box-shadow: var(--shadow-lg), var(--inset-highlight);
            transform: translateY(-2px);
        }
        .card:active {
            transform: scale(0.98);
            transition-duration: 0.08s;
        }
        .card--static { cursor: default; }
        .card--static:hover {
            transform: none;
            background: var(--surface);
            border-color: var(--border);
            box-shadow: var(--shadow-md), var(--inset-highlight);
        }
        .card--filtered-out { display: none; }

        .card__emoji {
            display: block;
            font-size: 2.8rem;
            margin-bottom: 10px;
            line-height: 1;
        }
        .card__title {
            font-size: 1.4rem;
            font-weight: 650;
            letter-spacing: -0.02em;
            color: var(--text);
            margin-bottom: 8px;
        }
        .card__link {
            display: inline-block;
            font-size: 0.95rem;
            font-weight: 500;
            border-bottom: 2px solid currentColor;
            padding-bottom: 2px;
            opacity: 0.85;
            transition: opacity 0.2s ease;
            pointer-events: none;
            word-break: break-all;
        }
        .card__desc {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-top: 8px;
        }

        .card[data-brand="telegram"] .card__link { color: var(--color-telegram); }
        .card[data-brand="instagram"] .card__link { color: var(--color-instagram); }
        .card[data-brand="threads"] .card__link { color: var(--color-threads); }
        .card[data-brand="tiktok"] .card__link { color: var(--color-tiktok); }
        .card[data-brand="wb"] .card__link { color: var(--color-wb); }
        .card[data-brand="meera"] .card__link { color: var(--color-meera); }

        .bottom-bar {
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            align-items: center;
            z-index: 100;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .bottom-bar--hidden {
            opacity: 0;
            pointer-events: none;
            transform: translateX(-50%) translateY(20px);
        }
        .dock {
            display: flex;
            gap: 8px;
            padding: 8px 12px;
            background: var(--surface);
            backdrop-filter: blur(var(--blur-strong)) saturate(200%);
            -webkit-backdrop-filter: blur(var(--blur-strong)) saturate(200%);
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-full);
            box-shadow: var(--shadow-lg), var(--inset-highlight);
        }
        .dock__btn {
            width: 72px;
            height: 56px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            border-radius: var(--radius-lg);
            color: var(--text-tertiary);
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.2px;
            transition: all 0.2s var(--ease-out);
        }
        .dock__btn svg {
            width: 20px;
            height: 20px;
            transition: transform 0.2s ease;
        }
        .dock__btn:hover {
            color: var(--text-secondary);
            background: var(--surface-hover);
            transform: scale(1.03);
        }
        .dock__btn:active {
            transform: scale(0.94);
            transition-duration: 0.05s;
        }
        .dock__btn--active {
            color: var(--text);
            background: var(--surface-active);
            box-shadow: inset 0 0 15px rgba(255, 255, 255, 0.08);
        }
        .fab {
            width: 72px;
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--surface);
            backdrop-filter: blur(var(--blur-strong)) saturate(200%);
            -webkit-backdrop-filter: blur(var(--blur-strong)) saturate(200%);
            border: 1px solid var(--border-strong);
            border-radius: 50%;
            box-shadow: var(--shadow-lg), var(--inset-highlight);
            color: var(--text-tertiary);
            transition: all 0.2s var(--ease-out);
        }
        .fab svg { width: 28px; height: 28px; }
        .fab:hover {
            color: var(--text-secondary);
            background: var(--surface-hover);
            transform: scale(1.05);
        }
        .fab:active { transform: scale(0.92); }
        .fab--active {
            color: var(--text);
            background: var(--surface-active);
            box-shadow: inset 0 0 15px rgba(255, 255, 255, 0.08), var(--shadow-lg);
        }

        .modal {
            position: fixed;
            inset: 0;
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }
        .modal[hidden] { display: none; }
        .modal--open {
            opacity: 1;
            pointer-events: auto;
        }
        .modal__backdrop {
            position: absolute;
            inset: 0;
            background: var(--overlay);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .modal__panel {
            position: relative;
            width: 100%;
            max-width: 440px;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
            padding: 32px 28px;
            text-align: center;
            background: var(--surface-solid);
            backdrop-filter: blur(var(--blur-strong)) saturate(180%);
            -webkit-backdrop-filter: blur(var(--blur-strong)) saturate(180%);
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-xl), var(--inset-highlight);
            transform: scale(0.9) translateY(20px);
            transition: transform 0.35s var(--ease-spring);
        }
        .modal--open .modal__panel { transform: scale(1) translateY(0); }
        .modal__close {
            position: absolute;
            top: 14px;
            right: 14px;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-tertiary);
            border-radius: 50%;
            transition: all 0.2s ease;
        }
        .modal__close:hover { color: var(--text); background: var(--surface-hover); }
        .modal__close:active { transform: scale(0.9); }
        .modal__close svg { width: 22px; height: 22px; }

        .modal__icon { font-size: 3.2rem; line-height: 1; margin-bottom: 8px; }
        .modal__title {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text);
            margin-bottom: 4px;
        }
        .modal__subtitle {
            font-size: 0.9rem;
            color: var(--text-tertiary);
            margin-bottom: 20px;
        }
        .modal__qr {
            width: 240px;
            height: 240px;
            margin: 0 auto 20px;
            padding: 14px;
            background: #fff;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-md);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .modal__qr canvas,
        .modal__qr img {
            width: 100% !important;
            height: 100% !important;
            image-rendering: pixelated;
        }
        .qr-skeleton {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #f0f0f0 0%, #e0e0e0 50%, #f0f0f0 100%);
            background-size: 200% 100%;
            border-radius: var(--radius-sm);
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .modal__actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .modal__row {
            display: flex;
            gap: 10px;
        }
        .modal__row .btn { flex: 1; }

    <!-- Экран "Нет подключения" — показывается ТОЛЬКО при отсутствии интернета -->
    <script>
        (function() {
            function showOfflineScreen() {
                if (document.getElementById('offlineScreen')) return;
                var s = document.getElementById('splash');
                if (s) s.style.display = 'none';
                var screen = document.createElement('div');
                screen.id = 'offlineScreen';
                screen.className = 'error-screen';
                screen.innerHTML =
                    '<div class="error-screen__emoji">📡</div>' +
                    '<div class="error-screen__title">Нет подключения к интернету</div>' +
                    '<div class="error-screen__msg">Проверьте соединение и попробуйте снова</div>' +
                    '<button class="error-screen__btn" onclick="location.reload()">Обновить</button>';
                document.body.appendChild(screen);
            }

            function hideOfflineScreen() {
                var screen = document.getElementById('offlineScreen');
                if (screen) screen.remove();
            }

            // Если нет интернета при загрузке — показываем экран
            if (!navigator.onLine) {
                setTimeout(showOfflineScreen, 800);
            }

            // Если интернет пропал во время использования — показываем экран
            window.addEventListener('offline', function() {
                setTimeout(showOfflineScreen, 300);
            });

            // Если интернет вернулся — убираем экран
            window.addEventListener('online', hideOfflineScreen);
        })();
    </script>

        function normalize(str) {
            return String(str).toLowerCase()
                .replace(/ё/g, 'е')
                .replace(/[^a-zа-я0-9\s]/gi, ' ')
                .replace(/\s+/g, ' ')
                .trim();
        }

        function levenshtein(a, b) {
            if (a === b) return 0;
            if (!a.length) return b.length;
            if (!b.length) return a.length;
            const m = [];
            for (let i = 0; i <= b.length; i++) m[i] = [i];
            for (let j = 0; j <= a.length; j++) m[0][j] = j;
            for (let i = 1; i <= b.length; i++) {
                for (let j = 1; j <= a.length; j++) {
                    m[i][j] = b[i - 1] === a[j - 1]
                        ? m[i - 1][j - 1]
                        : Math.min(m[i - 1][j - 1] + 1, m[i][j - 1] + 1, m[i - 1][j] + 1);
                }
            }
            return m[b.length][a.length];
        }

        function fuzzyMatch(query, text) {
            const q = normalize(query);
            const t = normalize(text);
            if (!q) return false;
            if (t.indexOf(q) !== -1) return true;

            const qWords = q.split(' ').filter(Boolean);
            const tWords = t.split(' ').filter(Boolean);

            for (let qi = 0; qi < qWords.length; qi++) {
                const qw = qWords[qi];
                if (qw.length < 3) {
                    if (t.indexOf(qw) === -1) return false;
                    continue;
                }
                const maxDist = qw.length <= 4 ? 1 : qw.length <= 7 ? 2 : 3;
                let found = false;
                for (let ti = 0; ti < tWords.length; ti++) {
                    const tw = tWords[ti];
                    if (Math.abs(tw.length - qw.length) > maxDist + 1) continue;
                    if (tw.indexOf(qw) !== -1 || qw.indexOf(tw) !== -1 || levenshtein(qw, tw) <= maxDist) {
                        found = true;
                        break;
                    }
                }
                if (!found) return false;
            }
            return true;
        }

        function performSearch(query) {
            const q = query.trim();
            if (!q) {
                searchResults.innerHTML = '';
                searchClear.hidden = true;
                return;
            }
            searchClear.hidden = false;

            const scored = [];
            for (let i = 0; i < searchableItems.length; i++) {
                const item = searchableItems[i];
                const hay = item.keywords;
                const nHay = normalize(hay);
                const nQ = normalize(q);
                let score = 0;
                if (nHay.indexOf(nQ) !== -1) {
                    score = 1000 - nHay.indexOf(nQ);
                } else if (fuzzyMatch(q, hay)) {
                    score = 500 - levenshtein(nQ, nHay.slice(0, nQ.length + 3));
                }
                if (score > 0) scored.push({ item: item, score: score });
            }
            scored.sort(function(a, b) { return b.score - a.score; });

            if (scored.length === 0) {
                searchResults.innerHTML =
                    '<div class="result-empty">' +
                    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                    '<circle cx="10" cy="10" r="7.5"/><line x1="22" y1="22" x2="16" y2="16"/></svg>' +
                    '<div class="result-empty__title">' + t('searchEmpty') + '</div>' +
                    '<div class="result-empty__query">«' + escapeHtml(q) + '»</div>' +
                    '</div>';
                return;
            }

            searchResults.innerHTML = '';
            scored.forEach(function(entry) {
                const item = entry.item;
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'result';
                btn.setAttribute('role', 'option');
                btn.innerHTML =
                    '<span class="result__icon">' + item.icon + '</span>' +
                    '<span class="result__info">' +
                        '<span class="result__name">' + escapeHtml(item.name) + '</span>' +
                        '<span class="result__desc">' + escapeHtml(item.desc) + '</span>' +
                    '</span>' +
                    '<span class="result__arrow">→</span>';
                btn.addEventListener('click', function() {
                    openLinkModal(item.card);
                    haptic();
                });
                searchResults.appendChild(btn);
            });
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        searchInput.addEventListener('input', function(e) { performSearch(e.target.value); });

        searchClear.addEventListener('click', function() {
            searchInput.value = '';
            searchInput.focus();
            performSearch('');
        });

        const views = {
            main: document.getElementById('viewMain'),
            search: document.getElementById('viewSearch')
        };
        const bottomBar = document.getElementById('bottomBar');
        const dockBtns = document.querySelectorAll('.dock__btn');
        const fabSearch = document.getElementById('fabSearch');

        function navigate(view) {
            if (view === 'settings') {
                openSettings();
                return;
            }
            store.set('currentView', view);

            Object.keys(views).forEach(function(name) {
                views[name].hidden = name !== view;
            });

            dockBtns.forEach(function(b) {
                b.classList.toggle('dock__btn--active', b.dataset.nav === view);
            });
            fabSearch.classList.toggle('fab--active', view === 'search');
            bottomBar.classList.remove('bottom-bar--hidden');

            if (view === 'search') {
                setTimeout(function() { searchInput.focus(); }, 200);
            }
            haptic();
        }

        document.querySelectorAll('[data-nav]').forEach(function(btn) {
            btn.addEventListener('click', function() { navigate(btn.dataset.nav); });
        });

        const toastEl = document.getElementById('toast');
        let toastTimer = null;

        function toast(msg) {
            toastEl.textContent = msg;
            toastEl.classList.add('toast--visible');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(function() { toastEl.classList.remove('toast--visible'); }, 2200);
        }

        async function copyToClipboard(text) {
            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(text);
                    return true;
                }
            } catch (e) {}
            try {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                const ok = document.execCommand('copy');
                document.body.removeChild(ta);
                return ok;
            } catch (e) {
                return false;
            }
        }

        function haptic() {
            if (navigator.vibrate) {
                try { navigator.vibrate(8); } catch (e) {}
            }
        }

        function hideSplash() {
            const splash = document.getElementById('splash');
            if (!splash) return;
            splash.classList.add('splash--hidden');
            setTimeout(function() { splash.style.display = 'none'; }, 650);
        }

        function init() {
            try {
                applyTheme(store.get('theme'));
                document.querySelectorAll('.segmented__item[data-theme]').forEach(function(b) {
                    const active = b.dataset.theme === store.get('theme');
                    b.classList.toggle('segmented__item--active', active);
                    b.setAttribute('aria-checked', active ? 'true' : 'false');
                });
                document.querySelectorAll('.segmented__item[data-lang]').forEach(function(b) {
                    const active = b.dataset.lang === store.get('lang');
                    b.classList.toggle('segmented__item--active', active);
                    b.setAttribute('aria-checked', active ? 'true' : 'false');
                });

                initEmojis();
                initFilters();
                renderCards();
                applyI18n();
            } catch (e) {
                console.error('Init error:', e);
            }

            // Splash скрывается через 500 мс — как в оригинале
            requestAnimationFrame(function() {
                setTimeout(hideSplash, 500);
            });

            // Service Worker — только если файл существует
            if ('serviceWorker' in navigator && location.protocol !== 'file:') {
                fetch('sw.js', { method: 'HEAD' })
                    .then(function(r) {
                        if (r.ok) return navigator.serviceWorker.register('sw.js');
                    })
                    .catch(function() {});
            }

            // Аналитика
            try {
                const gc = document.createElement('script');
                gc.async = true;
                gc.dataset.goatcounter = 'https://mmmmislm.goatcounter.com/count';
                gc.src = '//gc.zgo.at/count.js';
                document.head.appendChild(gc);
            } catch (e) {}
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
